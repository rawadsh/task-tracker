<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Task Tracker Kanban</title>
    <style>
      :root {
        color-scheme: light;
        font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        --bg: #f4f6fb;
        --panel: #ffffff;
        --border: #dbe2f0;
        --text: #1f2937;
        --muted: #64748b;
        --accent: #2563eb;
        --accent-soft: #dbeafe;
        --danger: #dc2626;
        --danger-soft: #fee2e2;
        --todo: #f59e0b;
        --inprogress: #3b82f6;
        --done: #10b981;
      }

      * { box-sizing: border-box; }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--text);
      }

      .app-shell {
        max-width: 1200px;
        margin: 0 auto;
        padding: 24px;
      }

      .topbar {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 16px;
      }

      .topbar h1 {
        margin: 0;
        font-size: 1.6rem;
      }

      .topbar .subtitle {
        color: var(--muted);
        margin-top: 4px;
      }

      button {
        border: 0;
        border-radius: 8px;
        padding: 10px 14px;
        font: inherit;
        cursor: pointer;
      }

      .btn-primary {
        background: var(--accent);
        color: white;
      }

      .btn-secondary {
        background: var(--panel);
        border: 1px solid var(--border);
        color: var(--text);
      }

      .status {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        font-size: 0.8rem;
        color: var(--muted);
      }

      .card-panel {
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 16px;
        padding: 16px;
        box-shadow: 0 12px 30px rgba(15, 23, 42, 0.05);
      }

      .state {
        display: none;
        padding: 24px;
        text-align: center;
        color: var(--muted);
      }

      .state.active { display: block; }

      .state.error {
        background: var(--danger-soft);
        color: var(--danger);
        border-radius: 12px;
      }

      .board {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 16px;
      }

      .column {
        background: #f8fafc;
        border: 1px solid var(--border);
        border-radius: 14px;
        padding: 12px;
        min-height: 280px;
      }

      .column.drag-over {
        border-color: var(--accent);
        background: var(--accent-soft);
      }

      .column h2 {
        margin: 0 0 12px;
        font-size: 1rem;
        display: flex;
        align-items: center;
        justify-content: space-between;
      }

      .column-count {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-width: 24px;
        height: 24px;
        border-radius: 999px;
        background: white;
        color: var(--muted);
        font-size: 0.85rem;
      }

      .task-card {
        background: white;
        border: 1px solid var(--border);
        border-radius: 12px;
        padding: 12px;
        margin-bottom: 10px;
        cursor: grab;
      }

      .task-card:active { cursor: grabbing; }

      .task-card h3 {
        margin: 0 0 8px;
        font-size: 1rem;
      }

      .task-card p {
        margin: 0 0 10px;
        font-size: 0.92rem;
        color: var(--muted);
      }

      .chip-row {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
      }

      .badge {
        display: inline-flex;
        align-items: center;
        border-radius: 999px;
        padding: 4px 8px;
        font-size: 0.75rem;
        font-weight: 600;
      }

      .badge.high { background: #fee2e2; color: #b91c1c; }
      .badge.medium { background: #fef3c7; color: #92400e; }
      .badge.low { background: #dcfce7; color: #166534; }

      .task-card .meta {
        color: var(--muted);
        font-size: 0.8rem;
      }

      .task-card .actions {
        display: flex;
        justify-content: flex-end;
        margin-top: 8px;
      }

      .task-card .actions button {
        padding: 6px 8px;
        background: transparent;
        color: var(--accent);
      }

      .modal-backdrop {
        position: fixed;
        inset: 0;
        display: none;
        align-items: center;
        justify-content: center;
        background: rgba(15, 23, 42, 0.5);
        padding: 20px;
      }

      .modal-backdrop.open { display: flex; }

      .modal {
        width: min(100%, 520px);
        background: white;
        border-radius: 16px;
        padding: 20px;
        box-shadow: 0 18px 40px rgba(15, 23, 42, 0.2);
      }

      .modal h2 { margin-top: 0; }
      .field { display: flex; flex-direction: column; gap: 6px; margin-bottom: 12px; }
      .field label { font-weight: 600; }
      .field input,
      .field textarea,
      .field select {
        font: inherit;
        padding: 10px 12px;
        border: 1px solid var(--border);
        border-radius: 8px;
      }

      .field textarea { min-height: 90px; resize: vertical; }

      .form-error {
        display: none;
        margin-bottom: 12px;
        padding: 10px 12px;
        border-radius: 10px;
        background: var(--danger-soft);
        color: var(--danger);
      }

      .modal-actions {
        display: flex;
        justify-content: flex-end;
        gap: 10px;
        margin-top: 8px;
      }

      @media (max-width: 850px) {
        .board { grid-template-columns: 1fr; }
        .topbar { flex-direction: column; align-items: flex-start; gap: 10px; }
      }
    </style>
  </head>
  <body>
    <div class="app-shell">
      <div class="topbar">
        <div>
          <h1>Task Tracker Kanban</h1>
          <div class="subtitle">Drag cards between columns and update tasks in place.</div>
        </div>
        <button id="newTaskBtn" class="btn-primary">+ New task</button>
      </div>

      <div class="card-panel">
        <div id="loadingState" class="state active">Loading tasks…</div>
        <div id="errorState" class="state error"></div>
        <div id="emptyState" class="state">No tasks yet. Create the first card to get started.</div>

        <div id="board" class="board" hidden></div>
      </div>
    </div>

    <div id="modalBackdrop" class="modal-backdrop">
      <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
        <h2 id="modalTitle">Create task</h2>
        <div id="formError" class="form-error"></div>
        <form id="taskForm">
          <input id="taskId" type="hidden" />

          <div class="field">
            <label for="title">Title</label>
            <input id="title" name="title" required maxlength="200" />
          </div>

          <div class="field">
            <label for="description">Description</label>
            <textarea id="description" name="description"></textarea>
          </div>

          <div class="field">
            <label for="status">Status</label>
            <select id="status" name="status">
              <option value="ToDo">ToDo</option>
              <option value="InProgress">InProgress</option>
              <option value="Done">Done</option>
            </select>
          </div>

          <div class="field">
            <label for="priority">Priority</label>
            <select id="priority" name="priority">
              <option value="Low">Low</option>
              <option value="Medium">Medium</option>
              <option value="High">High</option>
            </select>
          </div>

          <div class="field">
            <label for="assignee">Assignee</label>
            <input id="assignee" name="assignee" />
          </div>

          <div class="modal-actions">
            <button type="button" id="cancelBtn" class="btn-secondary">Cancel</button>
            <button type="submit" class="btn-primary">Save task</button>
          </div>
        </form>
      </div>
    </div>

    <script>
      const API_BASE = 'http://127.0.0.1:8000';
      const PRIORITY_ORDER = { High: 0, Medium: 1, Low: 2 };
      const STATUS_META = {
        ToDo: { title: 'ToDo', accent: 'var(--todo)' },
        InProgress: { title: 'InProgress', accent: 'var(--inprogress)' },
        Done: { title: 'Done', accent: 'var(--done)' },
      };

      let tasks = [];
      let editingTaskId = null;
      let draggedTaskId = null;

      const loadingState = document.getElementById('loadingState');
      const errorState = document.getElementById('errorState');
      const emptyState = document.getElementById('emptyState');
      const board = document.getElementById('board');
      const modalBackdrop = document.getElementById('modalBackdrop');
      const taskForm = document.getElementById('taskForm');
      const formError = document.getElementById('formError');
      const modalTitle = document.getElementById('modalTitle');
      const taskIdInput = document.getElementById('taskId');
      const titleInput = document.getElementById('title');
      const descriptionInput = document.getElementById('description');
      const statusInput = document.getElementById('status');
      const priorityInput = document.getElementById('priority');
      const assigneeInput = document.getElementById('assignee');
      const newTaskBtn = document.getElementById('newTaskBtn');
      const cancelBtn = document.getElementById('cancelBtn');

      document.addEventListener('DOMContentLoaded', () => {
        newTaskBtn.addEventListener('click', openCreateModal);
        cancelBtn.addEventListener('click', closeModal);
        modalBackdrop.addEventListener('click', (event) => {
          if (event.target === modalBackdrop) closeModal();
        });
        taskForm.addEventListener('submit', handleSubmit);
        board.addEventListener('click', handleBoardClick);
        board.addEventListener('dragstart', (event) => {
          const card = event.target.closest('.task-card');
          if (!card) return;
          draggedTaskId = card.dataset.id;
          card.classList.add('dragging');
        });
        board.addEventListener('dragend', (event) => {
          const card = event.target.closest('.task-card');
          if (card) card.classList.remove('dragging');
          document.querySelectorAll('.column').forEach((column) => column.classList.remove('drag-over'));
          draggedTaskId = null;
        });
        board.addEventListener('dragover', (event) => {
          const column = event.target.closest('.column');
          if (!column) return;
          event.preventDefault();
          column.classList.add('drag-over');
        });
        board.addEventListener('dragleave', (event) => {
          const column = event.target.closest('.column');
          if (!column) return;
          column.classList.remove('drag-over');
        });
        board.addEventListener('drop', async (event) => {
          const column = event.target.closest('.column');
          if (!column || !draggedTaskId) return;
          event.preventDefault();
          const nextStatus = column.dataset.status;
          column.classList.remove('drag-over');
          await updateTaskStatus(draggedTaskId, nextStatus);
        });
        loadTasks();
      });

      async function loadTasks() {
        setViewState('loading');
        try {
          const response = await fetch(`${API_BASE}/tasks`);
          if (!response.ok) {
            throw new Error('Unable to load tasks from the backend.');
          }
          tasks = await response.json();
          renderBoard();
        } catch (error) {
          setViewState('error', error.message || 'Unexpected error.');
        }
      }

      function renderBoard() {
        const groups = { ToDo: [], InProgress: [], Done: [] };
        tasks.forEach((task) => {
          if (groups[task.status]) {
            groups[task.status].push(task);
          }
        });

        Object.keys(groups).forEach((status) => {
          groups[status].sort((a, b) => PRIORITY_ORDER[a.priority] - PRIORITY_ORDER[b.priority]);
        });

        board.innerHTML = '';
        Object.entries(groups).forEach(([status, columnTasks]) => {
          const column = document.createElement('section');
          column.className = 'column';
          column.dataset.status = status;
          column.innerHTML = `
            <h2>
              <span>${STATUS_META[status].title}</span>
              <span class="column-count">${columnTasks.length}</span>
            </h2>
            ${columnTasks.length ? columnTasks.map((task) => renderTaskCard(task)).join('') : '<div class="status">Drop a task here</div>'}
          `;
          board.appendChild(column);
        });

        if (tasks.length === 0) {
          setViewState('empty');
        } else {
          setViewState('ready');
        }
      }

      function renderTaskCard(task) {
        return `
          <article class="task-card" draggable="true" data-id="${task.id}">
            <div class="chip-row">
              <h3>${escapeHtml(task.title)}</h3>
              <span class="badge ${task.priority.toLowerCase()}">${escapeHtml(task.priority)}</span>
            </div>
            <p>${escapeHtml(task.description || 'No description')}</p>
            <div class="chip-row meta">
              <span>${escapeHtml(task.assignee || 'Unassigned')}</span>
            </div>
            <div class="actions">
              <button type="button" data-action="edit" data-id="${task.id}">Edit</button>
            </div>
          </article>
        `;
      }

      async function updateTaskStatus(taskId, nextStatus) {
        const task = tasks.find((item) => item.id === taskId);
        if (!task || task.status === nextStatus) return;

        try {
          const response = await fetch(`${API_BASE}/tasks/${taskId}`, {
            method: 'PATCH',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ status: nextStatus }),
          });
          if (!response.ok) {
            const data = await response.json().catch(() => ({}));
            throw new Error(formatErrorMessage(data));
          }
          await loadTasks();
        } catch (error) {
          setViewState('error', error.message || 'Unable to update task status.');
        }
      }

      function handleBoardClick(event) {
        const button = event.target.closest('[data-action="edit"]');
        if (!button) return;
        const task = tasks.find((item) => item.id === button.dataset.id);
        if (!task) return;
        openEditModal(task);
      }

      function openCreateModal() {
        editingTaskId = null;
        modalTitle.textContent = 'Create task';
        taskForm.reset();
        taskIdInput.value = '';
        statusInput.value = 'ToDo';
        priorityInput.value = 'Medium';
        formError.style.display = 'none';
        formError.textContent = '';
        modalBackdrop.classList.add('open');
      }

      function openEditModal(task) {
        editingTaskId = task.id;
        modalTitle.textContent = 'Edit task';
        taskIdInput.value = task.id;
        titleInput.value = task.title;
        descriptionInput.value = task.description || '';
        statusInput.value = task.status;
        priorityInput.value = task.priority;
        assigneeInput.value = task.assignee || '';
        formError.style.display = 'none';
        formError.textContent = '';
        modalBackdrop.classList.add('open');
      }

      function closeModal() {
        modalBackdrop.classList.remove('open');
        taskForm.reset();
        editingTaskId = null;
        formError.style.display = 'none';
        formError.textContent = '';
      }

      async function handleSubmit(event) {
        event.preventDefault();
        const title = titleInput.value.trim();
        if (!title) {
          showFormError('Title is required.');
          return;
        }

        const payload = {
          title,
          description: descriptionInput.value.trim(),
          status: statusInput.value,
          priority: priorityInput.value,
          assignee: assigneeInput.value.trim() || null,
        };

        try {
          const response = await fetch(`${API_BASE}/tasks${editingTaskId ? `/${editingTaskId}` : ''}`, {
            method: editingTaskId ? 'PATCH' : 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload),
          });
          if (!response.ok) {
            const data = await response.json().catch(() => ({}));
            throw new Error(formatErrorMessage(data));
          }
          closeModal();
          await loadTasks();
        } catch (error) {
          showFormError(error.message || 'Unable to save task.');
        }
      }

      function showFormError(message) {
        formError.textContent = message;
        formError.style.display = 'block';
      }

      function setViewState(state, message = '') {
        loadingState.classList.remove('active');
        errorState.classList.remove('active');
        emptyState.classList.remove('active');
        board.hidden = true;

        if (state === 'loading') {
          loadingState.classList.add('active');
        } else if (state === 'error') {
          errorState.textContent = message;
          errorState.classList.add('active');
        } else if (state === 'empty') {
          emptyState.classList.add('active');
        } else {
          board.hidden = false;
        }
      }

      function formatErrorMessage(data) {
        if (typeof data.detail === 'string') return data.detail;
        if (Array.isArray(data.detail)) {
          return data.detail.map((item) => item.msg || JSON.stringify(item)).join(', ');
        }
        if (data.detail && typeof data.detail === 'object') {
          return data.detail.msg || JSON.stringify(data.detail);
        }
        return 'Request failed.';
      }

      function escapeHtml(value) {
        return String(value)
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;')
          .replace(/'/g, '&#39;');
      }
    </script>
  </body>
</html>
